# Regenera mapa/datos.js cada vez que el panel guarda contenido nuevo.
# El commit resultante hace que GitHub Pages vuelva a publicar la web.
name: Mapa · actualizar datos

on:
  push:
    branches: [main]
    paths: ['mapa/content/**', 'mapa/scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mapa-datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node mapa/scripts/build-datos.mjs
      - name: Guardar datos.js si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa/datos.js
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Mapa: regenera datos.js"
          git pull --rebase
          git push
